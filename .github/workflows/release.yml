name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0) — must match versionName"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APKs
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare artifacts
        id: artifact
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SRC=app/build/outputs/apk/release
          OUT="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUT"
          # Rename each per-ABI (and the universal) APK to a friendly name.
          for f in "$SRC"/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$f" "$OUT/Scanni-${TAG}-${abi}.apk"
          done
          cd "$OUT"
          sha256sum Scanni-*.apk > checksums.txt
          ls -la

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          cd "$GITHUB_WORKSPACE/dist"
          {
            echo "## Scanni $TAG"
            echo
            echo "### Which file do I download?"
            echo "- **Almost every phone (2017+) → \`Scanni-${TAG}-arm64-v8a.apk\`** — pick this one."
            echo "- Older 32-bit phones → \`Scanni-${TAG}-armeabi-v7a.apk\`"
            echo "- Not sure, or an emulator → \`Scanni-${TAG}-universal.apk\` (largest; runs everywhere)"
            echo
            echo "Open the file on your Android phone (8.0+) and tap install."
            echo
            echo "<details><summary><b>What's inside</b></summary>"
            echo
            echo "- 📷 Live document edge detection with auto-capture"
            echo "- ✂️ Intelligent crop with magnifier-assisted manual editor"
            echo "- 🎨 Six smart filters (Magic color, B&W, Whiteboard, …)"
            echo "- 🔤 On-device OCR — Latin (ML Kit) + Arabic (Tesseract, offline)"
            echo "- 🔎 Full-text search across all scans"
            echo "- 📄 Searchable PDF export (invisible text layer, Arabic included)"
            echo "- 🔒 100% offline — the camera is the only permission"
            echo "</details>"
            echo
            echo "### Checksums (SHA-256)"
            echo '```'
            cat checksums.txt
            echo '```'
          } > notes.md
          gh release create "$TAG" Scanni-*.apk checksums.txt \
            --target "$GITHUB_SHA" \
            --title "Scanni $TAG" \
            --notes-file notes.md
