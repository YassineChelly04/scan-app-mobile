name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.0) — must match versionName"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare artifact
        id: artifact
        run: |
          APK="Scanni-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APK="${{ steps.artifact.outputs.apk }}"
          {
            echo "## Scanni $TAG"
            echo
            echo "**Download \`$APK\` below, open it on your Android phone (8.0+), and install.**"
            echo
            echo "- 📷 Live document edge detection with auto-capture"
            echo "- ✂️ Intelligent crop with magnifier-assisted manual editor"
            echo "- 🎨 Six smart filters (Magic color, B&W, Whiteboard, …)"
            echo "- 🔤 On-device OCR — Latin (ML Kit) + Arabic (Tesseract, offline)"
            echo "- 🔎 Full-text search across all scans"
            echo "- 📄 Searchable PDF export (invisible text layer, Arabic included)"
            echo "- 🔒 100% offline — the camera is the only permission"
            echo
            echo "### Checksum"
            echo '```'
            cat "$APK.sha256"
            echo '```'
          } > notes.md
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --target "$GITHUB_SHA" \
            --title "Scanni $TAG" \
            --notes-file notes.md
