    <path d="M40 82 L33 82 Q26 82 26 75 L26 68" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Sheet shadow -->
    <path d="M44.5 35.5 H60.5 L71.5 46.5 V71.5 a5 5 0 0 1 -5 5 H44.5 a5 5 0 0 1 -5 -5 V40.5 a5 5 0 0 1 5 -5 Z" fill="#102B7A" fill-opacity="0.18"/>
